<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Character · Genshin Profile Viewer</title>
    <meta name="description" content="Stats, talents, weapon and artifacts for any of Achira’s Genshin Impact characters." />
    <meta name="theme-color" content="#12131a" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Genshin Profile Viewer" />
    <meta property="og:title" content="Character · Genshin Profile Viewer" />
    <meta property="og:description" content="Stats, talents, weapon and artifacts for any of Achira’s Genshin Impact characters." />
    <meta property="og:url" content="https://melsumner.github.io/gi-planetachira/character" />
    <meta property="og:image" content="https://melsumner.github.io/gi-planetachira/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gold four-point sparkle beside the text: Genshin Profile Viewer. Achira, America server. Characters, builds and artifacts, graded against recommended stats." />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="character.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <h1>Genshin Profile Viewer</h1>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="./">Profile</a></li>
          <li><a href="artifacts">Artifacts</a></li>
          <li><a href="builds">Build check</a></li>
        </ul>
      </nav>
      <form id="uid-form" class="uid-form">
        <label for="uid">UID</label>
        <input id="uid" name="uid" inputmode="numeric" pattern="\d{9,10}" required autocomplete="off" aria-describedby="uid-hint" />
        <span id="uid-hint" class="visually-hidden">9 or 10 digits</span>
        <button type="submit">Load</button>
        <button type="button" id="refresh">Refresh</button>
      </form>
    </header>

    <main id="main" tabindex="-1">
      <p><a id="back-link" class="back-link" href="./#roster"><span aria-hidden="true">← </span>All characters</a></p>

      <form id="picker" class="filters char-picker" hidden>
        <label>Character
          <select id="char-select"></select>
        </label>
        <button type="submit">Show</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <article id="character" class="character-panel" aria-labelledby="character-name" hidden></article>
    </main>

    <footer class="site-footer">
      <p>Character details come from HoYoLAB, so this page works for every character you own, not just your showcase.</p>
    </footer>
  </body>
</html>
