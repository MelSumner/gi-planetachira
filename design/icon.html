<!doctype html>
<!-- Source for the PNG icons. Render at the target size, e.g. ?size=180 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; overflow: hidden; background: transparent; }
      img { display: block; }
    </style>
  </head>
  <body>
    <img id="icon" alt="" />
    <script>
      const params = new URLSearchParams(location.search);
      const size = Number(params.get('size') ?? 32);
      const img = document.getElementById('icon');
      // Full-bleed square for apple-touch-icon; iOS rounds the corners itself.
      img.src = params.has('square') ? 'icon-square.svg' : '../public/favicon.svg';
      img.width = img.height = size;
    </script>
  </body>
</html>
